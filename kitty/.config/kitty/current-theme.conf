# vim:ft=kitty

## name:     Spooky Hollow
## author:   gui
## blurb:    Generated from ~/wallpaper.jpg — a spectral Halloween forest:
##           deep night woods, glowing ghosts and jack-o'-lanterns.

# The basic colors
foreground              #E2EBEE
background              #0d1117
selection_foreground    #101a26
selection_background    #A6E6E6

# Cursor colors
cursor                  #F2B763
cursor_text_color       #101a26

# URL underline color when hovering with mouse
url_color               #A6E6E6

# Kitty window border colors
active_border_color     #A6E6E6
inactive_border_color   #5A6E86
bell_border_color       #DE8E41

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #101a26
active_tab_background   #A6E6E6
inactive_tab_foreground #93A6B8
inactive_tab_background #17232F
tab_bar_background      #17232F

# Colors for marks (marked text in the terminal)
mark1_foreground #101a26
mark1_background #A6E6E6
mark2_foreground #101a26
mark2_background #F2B763
mark3_foreground #101a26
mark3_background #72BECB

# The 16 terminal colors

# black        (night bark / mist-lit bark)
color0  #33445A
color8  #5A6E86

# red          (rust ember)
color1  #B34E3E
color9  #CF614D

# green        (luminous path grass)
color2  #9FC756
color10 #98CF4A

# yellow       (jack-o'-lantern glow / candle cream)
color3  #DE8E41
color11 #EEE1AC

# blue         (twilight blue)
color4  #8C9FC3
color12 #A9BAD7

# magenta      (night purple / purple flowers)
color5  #9A728F
color13 #D09FBE

# cyan         (cyan mist / ghost glow)
color6  #72BECB
color14 #A6E6E6

# white        (pale mist)
color7  #DDE3E4
color15 #F2F7F6
