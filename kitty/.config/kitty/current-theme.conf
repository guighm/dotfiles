# vim:ft=kitty

## name:     Star Wars: Skywalker Sunset
## author:   gui
## blurb:    Gerada a partir de wallpapers/star-wars-skywalker-sunset.jpg
##           conforme design/DESIGN.md — céu teal noturno, nuvens
##           creme-amarelas, laranja-fogo da pluma do Vader e o ciano do
##           sabre como nota fria de apoio (nunca destaque principal).
##           Mapeamento 16 cores e cores básicas aplicados literalmente
##           do design; chrome (bordas, abas, marks) derivado dos tokens.

# The basic colors
foreground              #F2D9A8
background              #0D1E24
selection_foreground    #F2D9A8
selection_background    #1C3C44

# Cursor colors — ciano do sabre de luz
cursor                  #20B5DC
cursor_text_color       #0A191E

# URL underline color when hovering with mouse — laranja-fogo da pluma do Vader
url_color               #F18321

# Kitty window border colors
active_border_color     #FBD260
inactive_border_color   #CDB473
bell_border_color       #D62026

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #0A191E
active_tab_background   #F7DC83
inactive_tab_foreground #79989A
inactive_tab_background #14272E
tab_bar_background      #14272E

# Colors for marks (marked text in the terminal)
mark1_foreground #0A191E
mark1_background #20B5DC
mark2_foreground #0A191E
mark2_background #F18321
mark3_foreground #0A191E
mark3_background #B7AD7C

# The 16 terminal colors — mapeamento direto de design/DESIGN.md

# black        (silhueta funda / Estrela da Morte)
color0  #0B181D
color8  #1C3C44

# red          (vermelho dos logos/naves / chamas dos X-wings)
color1  #D62026
color9  #F52231

# green        (azeitona das nuvens sombreadas / azeitona clara)
color2  #B7AD7C
color10 #B1AB83

# yellow       (nuvens creme / nuvens vivas)
color3  #F7DC83
color11 #F9E473

# blue         (olho da Estrela da Morte / brilho do sabre, derivado)
color4  #1C7D86
color12 #8AD8E8

# magenta      (coral da pluma, derivado / coral claro, derivado)
color5  #E47C66
color13 #EBAB8C

# cyan         (cidade/água / ciano do sabre)
color6  #16A3BF
color14 #20B5DC

# white        (creme da moldura / core do sabre)
color7  #F2D9A8
color15 #F4FBF4
