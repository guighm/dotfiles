# Fuzzel — Kirby Snowy Night, matching kitty's current-theme.conf.
# Deep plum nights, Kirby pink, warm scarf gold.

[main]
# Same font and size as kitty (font_size 17). pixelsize + dpi-aware=no makes
# fuzzel multiply by the monitor scale, like kitty does.
font=JetBrainsMono Nerd Font:pixelsize=17
dpi-aware=no
use-bold=yes

prompt="❯ "
placeholder="Search…"

icons-enabled=yes
icon-theme=Adwaita
fields=name,generic,keywords,exec
terminal=kitty

# Window sizing: a bit wider than default, one line per entry.
lines=12
width=45
horizontal-pad=24
vertical-pad=16
inner-pad=10

[colors]
# Kirby Snowy Night — background has alpha so niri's blur shows through.
background=2b2431cc
text=f0e4daff
input=f0e4daff
prompt=f2a5b4ff
placeholder=6b5f78ff
match=f2d99cff
selection=3a2f45ff
selection-text=fbf3ecff
selection-match=f7d9a8ff
counter=6b5f78ff
border=f2a5b4ff

[border]
width=2
radius=12
selection-radius=6