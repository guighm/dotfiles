"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_flame)\
$os\
$username\
[](bg:color_cloud fg:color_flame)\
$directory\
[](fg:color_cloud bg:color_petrol)\
$git_branch\
$git_status\
[](fg:color_petrol bg:color_sabre)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_sabre bg:color_surface)\
$docker_context\
$conda\
$pixi\
[](fg:color_surface bg:color_deep)\
$time\
[ ](fg:color_deep)\
$line_break$character"""

palette = 'skywalker_sunset'

# Paleta gerada de wallpapers/star-wars-skywalker-sunset.jpg (ver design/DESIGN.md).
# Cena noturna teal: os pills abrem em fogo (pluma do Vader), o diretório é a
# nuvem creme (destaque principal), o git mergulha no azul-petróleo da cidade e
# as linguagens usam o ciano do sabre — nota fria de apoio, nunca o destaque.
# O pill final do relógio fecha no maroon queimado da base da pluma.
# Pills claros usam color_ink (teal-negro, feito para texto sobre claro);
# pills escuros usam color_cream (creme da moldura).
[palettes.skywalker_sunset]
color_ink = '#0A191E'          # teal-negro — texto sobre os pills claros
color_cream = '#F2D9A8'        # creme da moldura — texto sobre os pills escuros
color_flame = '#F18321'        # laranja-fogo da pluma do Vader — accent
color_cloud = '#F7DC83'        # creme-amarelo das nuvens — destaque principal
color_petrol = '#0C546C'       # azul-petróleo dos prédios escuros — pill do git
color_sabre = '#20B5DC'        # ciano do sabre de luz — linguagens
color_surface = '#1C3C44'      # Estrela da Morte/água escura — containers
color_deep = '#961824'         # maroon queimado da base da pluma — pill do relógio
color_olive = '#B7AD7C'        # azeitona das nuvens sombreadas — prompt de sucesso
color_red_bright = '#F52231'   # vermelho vivo das chamas/X-wings — erro
color_coral = '#E47C66'        # coral da pluma, derivado — vimcmd replace

[os]
disabled = false
style = "bg:color_flame fg:color_ink"

[os.symbols]
Windows = "󰍲 "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
EndeavourOS = " "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Pop = " "

[username]
show_always = true
style_user = "bg:color_flame fg:color_ink"
style_root = "bg:color_flame fg:color_ink"
format = '[$user ]($style)'

[directory]
style = "fg:color_ink bg:color_cloud"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_petrol"
format = '[[ $symbol $branch ](fg:color_cream bg:color_petrol)]($style)'

[git_status]
style = "bg:color_petrol"
format = '[[($all_status$ahead_behind )](fg:color_cream bg:color_petrol)]($style)'

[nodejs]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[bun]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[c]
symbol = " "
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[cpp]
symbol = " "
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[rust]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[golang]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[php]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[java]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:color_petrol"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:color_cream bg:color_petrol)]($style)'

[jj_status]
style = "bg:color_petrol"
format = '[[($all )](fg:color_cream bg:color_petrol)]($style)'

[kotlin]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[haskell]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[python]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[docker_context]
symbol = ""
style = "bg:color_surface"
format = '[[ $symbol( $context) ](fg:color_cream bg:color_surface)]($style)'

[conda]
style = "bg:color_surface"
format = '[[ $symbol( $environment) ](fg:color_cream bg:color_surface)]($style)'

[pixi]
style = "bg:color_surface"
format = '[[ $symbol( $version)( $environment) ](fg:color_cream bg:color_surface)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_deep"
format = '[[  $time ](fg:color_cream bg:color_deep)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_olive)'
error_symbol = '[](bold fg:color_red_bright)'
vimcmd_symbol = '[](bold fg:color_olive)'
vimcmd_replace_one_symbol = '[](bold fg:color_coral)'
vimcmd_replace_symbol = '[](bold fg:color_coral)'
vimcmd_visual_symbol = '[](bold fg:color_cloud)'
