"$schema" = 'https://starship.rs/config-schema.json'

format = """
 [](color_pink)\
$os\
$username\
[](bg:color_gold fg:color_pink)\
$directory\
[](fg:color_gold bg:color_teal)\
$git_branch\
$git_status\
[](fg:color_teal bg:color_sky)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_sky bg:color_frost)\
$docker_context\
$conda\
$pixi\
[](fg:color_frost bg:color_blossom)\
$time\
[ ](fg:color_blossom)\
$line_break $character"""

palette = 'brand_new_day'

# Paleta gerada de wallpapers/spiderman-brand-new-day.jpg (ver design/DESIGN.md),
# casa com o tema do kitty. Texto escuro sobre os pills = color_ink
# (noite profunda das bordas da arte, feito para texto sobre claro).
[palettes.brand_new_day]
color_ink = '#1C0E14'        # noite profunda das bordas do wallpaper (texto sobre os pills)
color_pink = '#C24B8F'       # teias em tom de vinho/rosa ao redor do personagem
color_gold = '#F5A623'       # explosão dourada atrás do personagem
color_teal = '#2E7FA8'       # azul sombra do traje/fundo frio
color_sky = '#7FD4EC'        # brilho ciano do olho do personagem
color_frost = '#B8A9C9'      # lilás apagado das teias contra a noite
color_blossom = '#E07AB8'    # glow magenta/rosa da arte
color_green = '#6FBF76'
color_red = '#B52330'
color_red_bright = '#C8535F'
color_purple = '#C24B8F'
color_cream = '#F4EDE1'

[os]
disabled = false
style = "bg:color_pink fg:color_ink"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_pink fg:color_ink"
style_root = "bg:color_pink fg:color_ink"
format = '[ $user ]($style)'

[directory]
style = "fg:color_ink bg:color_gold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_teal"
format = '[[ $symbol $branch ](fg:color_cream bg:color_teal)]($style)'

[git_status]
style = "bg:color_teal"
format = '[[($all_status$ahead_behind )](fg:color_cream bg:color_teal)]($style)'

[nodejs]
symbol = ""
style = "bg:color_sky"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sky)]($style)'

[bun]
symbol = ""
style = "bg:color_sky"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sky)]($style)'

[c]
symbol = " "
style = "bg:color_sky"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sky)]($style)'

[cpp]
symbol = " "
style = "bg:color_sky"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sky)]($style)'

[rust]
symbol = ""
style = "bg:color_sky"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sky)]($style)'

[golang]
symbol = ""
style = "bg:color_sky"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sky)]($style)'

[php]
symbol = ""
style = "bg:color_sky"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sky)]($style)'

[java]
symbol = ""
style = "bg:color_sky"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sky)]($style)'

[kotlin]
symbol = ""
style = "bg:color_sky"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sky)]($style)'

[haskell]
symbol = ""
style = "bg:color_sky"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sky)]($style)'

[python]
symbol = ""
style = "bg:color_sky"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sky)]($style)'

[docker_context]
symbol = ""
style = "bg:color_frost"
format = '[[ $symbol( $context) ](fg:color_ink bg:color_frost)]($style)'

[conda]
style = "bg:color_frost"
format = '[[ $symbol( $environment) ](fg:color_ink bg:color_frost)]($style)'

[pixi]
style = "bg:color_frost"
format = '[[ $symbol( $version)( $environment) ](fg:color_ink bg:color_frost)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_blossom"
format = '[[  $time ](fg:color_ink bg:color_blossom)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red_bright)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_cream)'
