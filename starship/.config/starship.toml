"$schema" = 'https://starship.rs/config-schema.json'

format = """
 [](color_amber)\
$os\
$username\
[](bg:color_cloud fg:color_amber)\
$directory\
[](fg:color_cloud bg:color_petrol)\
$git_branch\
$git_status\
[](fg:color_petrol bg:color_sabre)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_sabre bg:color_olive)\
$docker_context\
$conda\
$pixi\
[](fg:color_olive bg:color_flame)\
$time\
[ ](fg:color_flame)\
$line_break $character"""

palette = 'skywalker_sunset'

# Paleta gerada de wallpapers/star-wars-skywalker-sunset.jpg (ver design/DESIGN.md).
# Cena noturna: pills claras de nuvem/âmbar sobre fundo teal, com o ciano do sabre
# como nota fria de apoio. Texto escuro sobre os pills = color_ink (teal-negro,
# feito para texto sobre claro); único pill escuro (git) usa color_cream.
[palettes.skywalker_sunset]
color_ink = '#0A191E'          # teal-negro — texto sobre os pills claros
color_amber = '#CDB473'        # âmbar-oliva das nuvens sombreadas
color_cloud = '#F7DC83'        # creme-amarelo das nuvens — destaque principal
color_petrol = '#0C546C'       # azul-petróleo dos prédios escuros — único pill escuro
color_sabre = '#20B5DC'        # ciano do sabre de luz — nota fria de apoio
color_olive = '#B7AD7C'        # azeitona das nuvens sombreadas
color_flame = '#F18321'        # laranja-fogo da pluma do Vader
color_red = '#D62026'          # vermelho dos logos imperiais/rebeldes
color_red_bright = '#F52231'   # vermelho vivo das chamas/X-wings — erro em destaque
color_coral = '#E47C66'        # coral da pluma, derivado — vimcmd replace
color_cream = '#F2D9A8'        # creme da moldura — texto sobre o pill escuro

[os]
disabled = false
style = "bg:color_amber fg:color_ink"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_amber fg:color_ink"
style_root = "bg:color_amber fg:color_ink"
format = '[ $user ]($style)'

[directory]
style = "fg:color_ink bg:color_cloud"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = ""
"Music" = "󰝚 "
"Pictures" = ""
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_petrol"
format = '[[ $symbol $branch ](fg:color_cream bg:color_petrol)]($style)'

[git_status]
style = "bg:color_petrol"
format = '[[($all_status$ahead_behind )](fg:color_cream bg:color_petrol)]($style)'

[nodejs]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[bun]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[c]
symbol = " "
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[cpp]
symbol = " "
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[rust]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[golang]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[php]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[java]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[kotlin]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[haskell]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[python]
symbol = ""
style = "bg:color_sabre"
format = '[[ $symbol( $version) ](fg:color_ink bg:color_sabre)]($style)'

[docker_context]
symbol = ""
style = "bg:color_olive"
format = '[[ $symbol( $context) ](fg:color_ink bg:color_olive)]($style)'

[conda]
style = "bg:color_olive"
format = '[[ $symbol( $environment) ](fg:color_ink bg:color_olive)]($style)'

[pixi]
style = "bg:color_olive"
format = '[[ $symbol( $version)( $environment) ](fg:color_ink bg:color_olive)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_flame"
format = '[[  $time ](fg:color_ink bg:color_flame)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_olive)'
error_symbol = '[](bold fg:color_red_bright)'
vimcmd_symbol = '[](bold fg:color_olive)'
vimcmd_replace_one_symbol = '[](bold fg:color_coral)'
vimcmd_replace_symbol = '[](bold fg:color_coral)'
vimcmd_visual_symbol = '[](bold fg:color_cream)'
